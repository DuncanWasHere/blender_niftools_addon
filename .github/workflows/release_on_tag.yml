on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release

permissions:
  contents: write

jobs:
  build:
    if: github.event.base_ref == 'refs/heads/master'
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Get Tag
        id: get_tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4

      # tomllib, used to read the version out of blender_manifest.toml, needs 3.11+
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check manifest version matches the tag
        run: |
          MANIFEST_VERSION=$(python -c "import tomllib; print(tomllib.load(open('io_scene_niftools/blender_manifest.toml','rb'))['version'])")
          TAG_VERSION="${{ steps.get_tag.outputs.tag_name }}"
          if [[ "v${MANIFEST_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::tag ${TAG_VERSION} does not match blender_manifest.toml version ${MANIFEST_VERSION}"
            exit 1
          fi

      - name: Build Extension
        id: build_addon
        run: |
          ./install/makezip.sh
          ZIP_NAME=$(ls ./install/temp | grep zip)
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_tag.outputs.tag_name }}
          ZIP: ${{ steps.build_addon.outputs.zip_name }}
        run: |
          cat > release_notes.md <<EOF
          **Changes in ${TAG}**

          [Full Changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.rst)

          **Installation**

          Download [${ZIP}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}),
          then in Blender use *Edit > Preferences > Add-ons > Install from Disk*, or drag the zip
          into the Blender window.

          This release is a Blender extension and requires Blender 5.0 or newer.
          EOF

          gh release create "${TAG}" "./install/temp/${ZIP}" \
            --title "Blender Niftools Addon - ${TAG}" \
            --notes-file release_notes.md
